name: CI Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Test (C Firmware & Python SIL)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc make

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile C FCS-MPC Shared Library
        run: make lib

      - name: Execute C Unit Test Suite
        run: make test

      - name: Execute Pytest SIL Verification Suite
        run: pytest simulation/ -v

      - name: Execute FCS-MPC Dynamic Benchmark Runner
        run: python simulation/harness/mpc_runner.py
